# The remote addin inside apps run by mpc-launch. The same port as MPC's own addin, so the
# tunnel (ssh -L 6721:127.0.0.1:6720) and the mpc MCP tools work whether MPC or an app is running.
enabled=1
bind=127.0.0.1
port=6720
touch_device=auto
screen_rotate=auto
touch_rotate=0
max_fps=10
max_clients=6
nice=10
mcp=1
mcp_files=/media,/data/mpc-launcher,/run/mpc-launcher
buttons_input=1

# Melodee (github.com/keremimo/melodee-sample) on sample-base branch live3. Melodee keeps its files on an SD card
# (/media/<card>/Melodee/Projects, Samples, Plugins); on the Live III a folder of the internal drive stands in for
# the card, seen by Melodee alone, and MPC's own folders are shared into it read-only: its plugins
# (Melodee/Plugins/MPC), samples and expansions (Melodee/Samples/MPC Samples, MPC Expansions). Melodee writes only
# into /nvme/MelodeeCard/Melodee.
TITLE="Melodee"
EXEC=bin/melodee
ARGS="--runtime-dir /run/mpc-launcher/melodee --seconds @SECONDS@"
SELF_TEST="--self-test /run/mpc-launcher/self-test.wav"
BIND="/nvme/MelodeeCard:/media/card
/nvme/VST2 Plugins:/media/card/Melodee/Plugins/MPC:ro
/nvme/MPC Documents/Samples:/media/card/Melodee/Samples/MPC Samples:ro
/nvme/Expansions:/media/card/Melodee/Samples/MPC Expansions:ro"
